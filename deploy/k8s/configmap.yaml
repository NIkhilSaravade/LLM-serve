apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-serve-config
  labels: {app: llm-serve}
data:
  # Engine configuration (engine/config.py). Changing it needs a rollout: the KV pool is sized
  # at start-up. kv_budget_mib must fit inside the pod memory limit with the ~0.7 GiB the model
  # and Python need; the deployment limit is 4 GiB for a 1 GiB budget.
  LLM_SERVE_CONFIG: >-
    {"backend":"paged","batching":"continuous","max_batch":16,"kv_budget_mib":1024,
    "block_size":16,"preemption":true,"max_queue":64}
  # Must equal the CPU request/limit in the deployment: torch threads beyond the CPU quota are
  # throttled and make tail latency worse, not better.
  LLM_SERVE_THREADS: "4"
