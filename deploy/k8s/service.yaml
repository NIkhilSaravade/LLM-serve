apiVersion: v1
kind: Service
metadata:
  name: llm-serve
  labels: {app: llm-serve}
spec:
  selector: {app: llm-serve}
  ports:
    - {name: http, port: 80, targetPort: http}
  # LIMITATION: kube-proxy balances per connection, not per outstanding request, so a replica
  # with a long queue can keep receiving traffic. Put an ingress/mesh that does least-request
  # balancing in front for real deployments.
