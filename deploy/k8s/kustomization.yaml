apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm-serve
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
# Pin the model version by image tag, never :latest. CI sets this to the commit SHA.
images:
  - name: llm-serve
    newName: ghcr.io/nikhilsaravade/llm-serve
    newTag: "REPLACE_WITH_GIT_SHA"
