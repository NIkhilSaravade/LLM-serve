# Needs the Prometheus Operator CRDs (kube-prometheus-stack). Apply after the base:
#   kubectl apply -k deploy/k8s && kubectl apply -k deploy/k8s/monitoring
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm-serve
resources:
  - servicemonitor.yaml
  - prometheus-rule.yaml
