# GENERATED by scripts/render_prometheus_rule.py from deploy/prometheus/alerts.yml.
# Do not edit by hand.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: llm-serve
  labels:
    app: llm-serve
spec:
  groups:
  - name: llm-serve-recording
    rules:
    - record: llm:ttft_slo_bad_ratio:rate5m
      expr: "1 - (\n  sum(rate(llm_ttft_seconds_bucket{le=\"2.0\"}[5m]))\n  / clamp_min(sum(rate(llm_ttft_seconds_count[5m])),\
        \ 1e-9)\n)\n"
    - record: llm:ttft_slo_bad_ratio:rate1h
      expr: "1 - (\n  sum(rate(llm_ttft_seconds_bucket{le=\"2.0\"}[1h]))\n  / clamp_min(sum(rate(llm_ttft_seconds_count[1h])),\
        \ 1e-9)\n)\n"
    - record: llm:rejection_ratio:rate5m
      expr: 'sum(rate(llm_requests_total{status="rejected"}[5m]))

        / clamp_min(sum(rate(llm_requests_total[5m])), 1e-9)

        '
  - name: llm-serve-availability
    rules:
    - alert: LLMServeDown
      expr: up{job="llm-serve"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: llm-serve target is down
        description: Prometheus cannot scrape {{ $labels.instance }} for 2 minutes.
        runbook: docs/07-operations.md#runbook-llmservedown
    - alert: LLMSchedulerThreadDead
      expr: llm_engine_thread_alive == 0
      for: 30s
      labels:
        severity: critical
      annotations:
        summary: Scheduler thread died; the process is up but serves nothing
        description: '{{ $labels.instance }}: the liveness probe should restart it.'
        runbook: docs/07-operations.md#runbook-llmschedulerthreaddead
  - name: llm-serve-slo
    rules:
    - alert: LLMTTFTSLOFastBurn
      expr: 'llm:ttft_slo_bad_ratio:rate1h > (14.4 * 0.01)

        and

        llm:ttft_slo_bad_ratio:rate5m > (14.4 * 0.01)

        '
      for: 2m
      labels:
        severity: page
      annotations:
        summary: TTFT SLO error budget burning fast
        description: '{{ $value | humanizePercentage }} of requests exceeded 2 s to first token.'
        runbook: docs/07-operations.md#runbook-latency
    - alert: LLMTTFTp99High
      expr: histogram_quantile(0.99, sum by (le) (rate(llm_ttft_seconds_bucket[5m]))) > 2
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: p99 time to first token above 2 s
        description: p99 TTFT is {{ $value | humanizeDuration }}.
        runbook: docs/07-operations.md#runbook-latency
    - alert: LLMTPOTp99High
      expr: histogram_quantile(0.99, sum by (le) (rate(llm_tpot_seconds_bucket[5m]))) > 0.2
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: p99 time per output token above 200 ms
        description: 'Decode is slow: batch too large for the CPU, or noisy neighbour.'
        runbook: docs/07-operations.md#runbook-latency
  - name: llm-serve-saturation
    rules:
    - alert: LLMHighRejectionRate
      expr: llm:rejection_ratio:rate5m > 0.05
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: More than 5% of requests are being rejected (HTTP 429)
        description: Offered load exceeds capacity; add replicas.
        runbook: docs/07-operations.md#runbook-overload
    - alert: LLMQueueNearCap
      expr: llm_queue_cap > 0 and llm_queue_depth > 0.75 * llm_queue_cap
      for: 3m
      labels:
        severity: warning
      annotations:
        summary: Admission queue above 75% of its cap
        description: Rejections are imminent.
        runbook: docs/07-operations.md#runbook-overload
    - alert: LLMKVMemoryPressure
      expr: llm_kv_units_used / llm_kv_units_total > 0.95
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: KV cache above 95% full for 10 minutes
        description: Concurrency is memory-bound; expect preemptions and higher latency.
        runbook: docs/07-operations.md#runbook-kv-memory
    - alert: LLMPreemptionStorm
      expr: rate(llm_preemptions_total[5m]) > 0.5
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Requests are being evicted more than once every two seconds
        description: 'Recompute is wasting capacity: raise the KV budget or lower max_batch.'
        runbook: docs/07-operations.md#runbook-kv-memory
