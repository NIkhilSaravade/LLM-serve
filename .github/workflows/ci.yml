name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: tests (golden + api + deploy config)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Cache Hugging Face weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-gpt2-v1
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check engine scripts tests --select E9,F
      - name: Generated files are current
        run: |
          python scripts/render_prometheus_rule.py --check
          python scripts/build_dashboard.py
          git diff --exit-code deploy/grafana
      # The golden tests are the correctness gate: greedy token ids must equal the HuggingFace
      # reference for every fixture, including batching, eviction and recompute. The wall-clock
      # throughput guard is deselected: shared runners are too noisy for a 20% threshold.
      - name: Tests
        run: pytest -q -m "not perf"

  go:
    name: load generator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: bench/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build -o /tmp/llm-bench .

  site:
    name: results page builds and renders
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Page data is current with the raw results
        run: |
          python scripts/build_site.py
          git diff --exit-code site-src/src/data.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site-src/package-lock.json
      - run: npm --prefix site-src ci
      - run: npm --prefix site-src run build
      # Opens the built single file from disk in desktop and mobile Chromium: no console errors,
      # no external requests, no element wider than the viewport, headline numbers present.
      - run: npx --prefix site-src playwright install --with-deps chromium
      - run: npm --prefix site-src run test:visual

  kubernetes:
    name: manifests render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render base and monitoring overlays
        run: |
          kubectl kustomize deploy/k8s > /dev/null
          kubectl kustomize deploy/k8s/monitoring > /dev/null

  container:
    name: image builds and serves
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t llm-serve:ci .
      - name: Run and smoke-test
        run: |
          docker run -d --name s -p 8000:8000 llm-serve:ci
          for i in $(seq 1 90); do
            curl -sf localhost:8000/ready >/dev/null && break
            sleep 2
          done
          curl -sf localhost:8000/ready
          curl -sf localhost:8000/version | grep -q '${{ github.sha }}'
          curl -sf -X POST localhost:8000/generate -H 'content-type: application/json' \
               -d '{"prompt":"The capital of France is","max_new_tokens":8}'
          curl -sf localhost:8000/metrics | grep -q '^llm_requests_total{status="ok"} 1.0'
      - name: Logs on failure
        if: failure()
        run: docker logs s
      - name: Runs as non-root
        run: test "$(docker run --rm --entrypoint id llm-serve:ci -u)" != 0
