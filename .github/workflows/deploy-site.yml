name: deploy-site

# ALTERNATIVE deploy path: Cloudflare Workers (static assets) driven from GitHub. The primary path is
# Cloudflare Pages connected to this repository (docs/08-deploying-the-site.md), so this runs only when
# started by hand (Actions tab, Run workflow) and needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# secrets. Do not enable both paths for the same domain.
on:
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false   # never interrupt a deploy midway

permissions:
  contents: read

jobs:
  deploy:
    name: build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site-src/package-lock.json
      - run: npm --prefix site-src ci
      - name: Typecheck and build
        run: npm --prefix site-src run build
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site-src
          command: deploy
      - name: Smoke-test the live site
        if: ${{ steps.deploy.outputs.deployment-url != '' }}
        run: |
          set -euo pipefail
          url="${{ steps.deploy.outputs.deployment-url }}"
          headers="$(curl -sSI "$url")"
          echo "$headers"
          echo "$headers" | grep -qi '^content-security-policy:.*script-src .self.'
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          curl -sSf "$url" | grep -q 'llm-serve'
